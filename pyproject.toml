[project]
name = "python-matter-doorlock"
version = "0.0.1"
description = "Utility Script for Managing Matter DoorLock Users and Credentials"
maintainers = [ { name = "Peter Babinski" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/matter/manifest.json#L11
  "python-matter-server>=8.1.2,<9",
]

[project.urls]
Homepage = "https://github.com/tailg8nj/python-matter-doorlock"
Issues = "https://github.com/tailg8nj/python-matter-doorlock/issues"

[tool.black]
line-length = 120
